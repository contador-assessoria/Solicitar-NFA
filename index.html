<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido de Nota Fiscal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 24px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .form-content {
            padding: 24px;
        }

        .section {
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 2px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #555;
            margin-bottom: 6px;
        }

        .required::after {
            content: '*';
            color: #e74c3c;
            margin-left: 4px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .error {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 4px;
            display: block;
        }

        .toggle-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .toggle-btn {
            padding: 12px;
            border: 2px solid #e0e0e0;
            background: #f8f9fa;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            text-align: center;
        }

        .toggle-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }

        .hidden {
            display: none !important;
        }

        .address-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .address-group.full {
            grid-template-columns: 1fr;
        }

        .produto-item {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            position: relative;
        }

        .produto-grid {
            display: grid;
            grid-template-columns: 80px 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .produto-valor-grid {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
            align-items: center;
        }

        .produto-item input {
            background: white;
        }

        .autocomplete {
            position: relative;
        }

        .autocomplete-items {
            position: absolute;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            width: 100%;
            margin-top: 4px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }

        .autocomplete-item {
            padding: 12px 16px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .autocomplete-item:hover {
            background: #f0f0f0;
        }

        .remover-produto {
            background: #e74c3c;
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
            transition: all 0.3s ease;
        }

        .remover-produto:active {
            transform: scale(0.95);
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 12px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:active {
            transform: translateY(2px);
        }

        .btn-success {
            background: #27ae60;
            color: white;
        }

        .btn-whatsapp {
            background: #25D366;
            color: white;
            font-size: 18px;
        }

        .total-display {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin: 20px 0;
        }

        .total-display .label {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 8px;
        }

        .total-display .value {
            font-size: 32px;
            font-weight: bold;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .container {
                border-radius: 0;
            }
            
            body {
                padding: 0;
            }

            .total-display .value {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📋 Pedido de Nota Fiscal</h1>
        <p>Preencha os dados para emissão</p>
    </div>

    <div class="form-content">
        <div class="section">
            <div class="section-title" id="tipo-nota-titulo">Selecione o tipo de nota</div>
            <div class="toggle-buttons" role="group" aria-labelledby="tipo-nota-titulo">
                <button type="button" class="toggle-btn" data-nota="nfa" aria-pressed="false" onclick="selecionarNota('nfa')">📦 NFA — Produtos</button>
                <button type="button" class="toggle-btn" data-nota="nfs" aria-pressed="false" onclick="selecionarNota('nfs')">🛠️ NFS — Serviços</button>
            </div>
        </div>

        <div id="dados-nota" class="hidden">
        <!-- Seção Tipo de Cliente -->
        <div class="section">
            <div class="section-title" id="titulo-cliente">Tipo de Cliente</div>
            <div class="toggle-buttons">
                <button type="button" class="toggle-btn active" data-cliente="cnpj" aria-pressed="true" onclick="selecionarTipo('cnpj')">
                    🏢 Empresa (CNPJ)
                </button>
                <button type="button" class="toggle-btn" data-cliente="cpf" aria-pressed="false" onclick="selecionarTipo('cpf')">
                    👤 Pessoa Física (CPF)
                </button>
            </div>
        </div>

        <!-- Dados CNPJ -->
        <div id="dados-cnpj" class="section">
            <div class="input-group">
                <label class="required" for="cnpj">CNPJ</label>
                <input type="text" id="cnpj" placeholder="00.000.000/0000-00" maxlength="18">
                <span id="cnpj-error" class="error"></span>
            </div>
            <div class="input-group">
                <label class="required" for="razao-social">Razão Social</label>
                <input type="text" id="razao-social" placeholder="Nome da empresa">
            </div>
        </div>

        <!-- Dados CPF -->
        <div id="dados-cpf" class="section hidden">
            <div class="input-group">
                <label class="required" for="cpf">CPF</label>
                <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14">
                <span id="cpf-error" class="error"></span>
            </div>
            <div class="input-group">
                <label class="required" for="nome-completo">Nome Completo</label>
                <input type="text" id="nome-completo" placeholder="Digite seu nome completo">
            </div>
            <div class="input-group">
                <label class="required" for="cep">CEP</label>
                <input type="text" id="cep" placeholder="00000-000" maxlength="9">
                <span id="cep-error" class="error"></span>
            </div>
            <div class="input-group">
                <label class="required" for="endereco">Endereço</label>
                <input type="text" id="endereco" placeholder="Rua, Avenida...">
            </div>
            <div class="address-group">
                <div class="input-group">
                    <label class="required" for="numero">Número</label>
                    <input type="text" id="numero" placeholder="Nº">
                </div>
                <div class="input-group">
                    <label for="complemento">Complemento</label>
                    <input type="text" id="complemento" placeholder="Apt, Sala...">
                </div>
            </div>
            <div class="address-group">
                <div class="input-group">
                    <label class="required" for="bairro">Bairro</label>
                    <input type="text" id="bairro" placeholder="Bairro">
                </div>
                <div class="input-group">
                    <label class="required" for="cidade">Cidade</label>
                    <input type="text" id="cidade" placeholder="Cidade">
                </div>
            </div>
            <div class="input-group">
                <label class="required" for="estado">Estado</label>
                <input type="text" id="estado" placeholder="UF" maxlength="2">
            </div>
            <div class="input-group">
                <label for="telefone">Telefone</label>
                <input type="text" id="telefone" placeholder="(00) 00000-0000" maxlength="15">
            </div>
        </div>

        <!-- Produtos da NFA -->
        <div class="section" id="secao-produtos">
            <div class="section-title">Produtos</div>
            <div id="produtos">
                <div class="produto-item">
                    <div class="produto-grid">
                        <input type="number" name="quantidade" placeholder="Qtd" min="1" value="1">
                        <div class="autocomplete">
                            <input type="text" name="descricao" placeholder="Descrição do produto">
                            <div class="autocomplete-items"></div>
                        </div>
                    </div>
                    <div class="produto-valor-grid">
                        <input type="text" name="valor" placeholder="Valor unitário (R$)">
                        <button type="button" class="remover-produto" onclick="removerProduto(this)">×</button>
                    </div>
                </div>
            </div>
            <button type="button" class="btn btn-success" onclick="adicionarProduto()">+ Adicionar Produto</button>
        </div>

        <!-- Descrição única da NFS -->
        <div class="section hidden" id="secao-servico">
            <div class="section-title">Dados do Serviço</div>
            <div class="input-group">
                <label for="descricao-servico" class="required">Descrição do serviço</label>
                <textarea id="descricao-servico" rows="6" placeholder="Descreva o serviço prestado em um único texto" aria-required="true"></textarea>
            </div>
            <div class="input-group">
                <label for="valor-servico" class="required">Valor do serviço (R$)</label>
                <input type="text" id="valor-servico" inputmode="numeric" placeholder="0,00" aria-required="true">
            </div>
        </div>

        <!-- Total -->
        <div class="total-display">
            <div class="label">Total da Nota</div>
            <div class="value" id="total">R$ 0,00</div>
        </div>

        <!-- Pagamento -->
        <div class="section">
            <div class="input-group">
                <label class="required" for="pagamento">Forma de Pagamento</label>
                <select id="pagamento">
                    <option value="">Selecione...</option>
                    <option value="DINHEIRO">💵 Dinheiro</option>
                    <option value="PIX">📱 PIX</option>
                    <option value="CARTÃO DE CRÉDITO">💳 Cartão de Crédito</option>
                    <option value="CARTÃO DE DÉBITO">💳 Cartão de Débito</option>
                    <option value="BOLETO">🧾 Boleto</option>
                    <option value="TRANSFERÊNCIA BANCÁRIA">🏦 Transferência Bancária</option>
                </select>
            </div>
        </div>

        <!-- Botão Enviar -->
        <button type="button" class="btn btn-whatsapp" onclick="enviarWhatsApp()">
            📱 Enviar Pedido via WhatsApp
        </button>
        </div>
    </div>
</div>

<script>
// Lista de produtos
const produtosDisponiveis = [
    "CARRAPINHA",
    "COCADA BRANCA",
    "COCADA COM LEITE CONDENSADO",
    "PAÇOCA",
    "PAÇOCA DE CHOCOLATE",
    "PÉ DE MOLEQUE",
    "RAPADURA LEITE",
    "RAPADURA LEITE NINHO"
];

let tipoNota = null;
let tipoCliente = 'cnpj';

function selecionarNota(tipo) {
    tipoNota = tipo;
    document.querySelectorAll('[data-nota]').forEach(btn => {
        const ativo = btn.dataset.nota === tipo;
        btn.classList.toggle('active', ativo);
        btn.setAttribute('aria-pressed', String(ativo));
    });
    document.getElementById('dados-nota').classList.remove('hidden');
    document.getElementById('secao-produtos').classList.toggle('hidden', tipo === 'nfs');
    document.getElementById('secao-servico').classList.toggle('hidden', tipo !== 'nfs');
    document.getElementById('titulo-cliente').textContent = tipo === 'nfs' ? 'Dados do Tomador' : 'Tipo de Cliente';
    recalcularTotal();
}

function selecionarTipo(tipo) {
    tipoCliente = tipo;
    document.querySelectorAll('[data-cliente]').forEach(btn => {
        const ativo = btn.dataset.cliente === tipo;
        btn.classList.toggle('active', ativo);
        btn.setAttribute('aria-pressed', String(ativo));
    });
    document.getElementById('dados-cnpj').classList.toggle('hidden', tipo !== 'cnpj');
    document.getElementById('dados-cpf').classList.toggle('hidden', tipo !== 'cpf');
}

// Formatação de campos
function formatarCNPJ(valor) {
    valor = valor.replace(/\D/g, '');
    valor = valor.replace(/^(\d{2})(\d)/, '$1.$2');
    valor = valor.replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3');
    valor = valor.replace(/\.(\d{3})(\d)/, '.$1/$2');
    valor = valor.replace(/(\d{4})(\d)/, '$1-$2');
    return valor;
}

function formatarCPF(valor) {
    valor = valor.replace(/\D/g, '');
    valor = valor.replace(/^(\d{3})(\d)/, '$1.$2');
    valor = valor.replace(/^(\d{3})\.(\d{3})(\d)/, '$1.$2.$3');
    valor = valor.replace(/\.(\d{3})(\d)/, '.$1-$2');
    return valor;
}

function formatarCEP(valor) {
    valor = valor.replace(/\D/g, '');
    valor = valor.replace(/^(\d{5})(\d)/, '$1-$2');
    return valor;
}

function formatarTelefone(valor) {
    valor = valor.replace(/\D/g, '');
    if (valor.length <= 10) {
        valor = valor.replace(/^(\d{2})(\d)/, '($1) $2');
        valor = valor.replace(/(\d{4})(\d)/, '$1-$2');
    } else {
        valor = valor.replace(/^(\d{2})(\d)/, '($1) $2');
        valor = valor.replace(/(\d{5})(\d)/, '$1-$2');
    }
    return valor;
}

function formatarMoeda(valor) {
    valor = valor.replace(/\D/g, '');
    if (!valor) return '';
    valor = (Number(valor) / 100).toFixed(2);
    valor = valor.replace('.', ',');
    return valor;
}

function lerValor(valor) {
    return Number(valor.replace(/\./g, '').replace(',', '.'));
}

document.getElementById('valor-servico').addEventListener('input', function() {
    this.value = formatarMoeda(this.value);
    recalcularTotal();
});

// Event listeners de formatação
document.getElementById('cnpj').addEventListener('input', function(e) {
    e.target.value = formatarCNPJ(e.target.value);
});

document.getElementById('cpf').addEventListener('input', function(e) {
    e.target.value = formatarCPF(e.target.value);
});

document.getElementById('cep').addEventListener('input', function(e) {
    e.target.value = formatarCEP(e.target.value);
});

if (document.getElementById('telefone')) {
    document.getElementById('telefone').addEventListener('input', function(e) {
        e.target.value = formatarTelefone(e.target.value);
    });
}

// Validação CNPJ
function validarCNPJ(cnpj) {
    cnpj = cnpj.replace(/\D/g, '');
    if (cnpj.length !== 14 || /^(\d)\1+$/.test(cnpj)) return false;

    let tamanho = cnpj.length - 2;
    let numeros = cnpj.substring(0, tamanho);
    let digitos = cnpj.substring(tamanho);
    let soma = 0;
    let pos = tamanho - 7;

    for (let i = tamanho; i >= 1; i--) {
        soma += parseInt(numeros.charAt(tamanho - i)) * pos--;
        if (pos < 2) pos = 9;
    }

    let resultado = soma % 11 < 2 ? 0 : 11 - (soma % 11);
    if (resultado !== parseInt(digitos.charAt(0))) return false;

    tamanho = tamanho + 1;
    numeros = cnpj.substring(0, tamanho);
    soma = 0;
    pos = tamanho - 7;

    for (let i = tamanho; i >= 1; i--) {
        soma += parseInt(numeros.charAt(tamanho - i)) * pos--;
        if (pos < 2) pos = 9;
    }

    resultado = soma % 11 < 2 ? 0 : 11 - (soma % 11);
    return resultado === parseInt(digitos.charAt(1));
}

// Validação CPF
function validarCPF(cpf) {
    cpf = cpf.replace(/\D/g, '');
    if (cpf.length !== 11 || /^(\d)\1+$/.test(cpf)) return false;

    let soma = 0;
    for (let i = 0; i < 9; i++) {
        soma += parseInt(cpf.charAt(i)) * (10 - i);
    }
    let resto = 11 - (soma % 11);
    let digito1 = resto >= 10 ? 0 : resto;

    if (digito1 !== parseInt(cpf.charAt(9))) return false;

    soma = 0;
    for (let i = 0; i < 10; i++) {
        soma += parseInt(cpf.charAt(i)) * (11 - i);
    }
    resto = 11 - (soma % 11);
    let digito2 = resto >= 10 ? 0 : resto;

    return digito2 === parseInt(cpf.charAt(10));
}

// Buscar CNPJ
document.getElementById('cnpj').addEventListener('blur', async function() {
    const cnpj = this.value.replace(/\D/g, '');
    const errorDiv = document.getElementById('cnpj-error');
    
    if (!cnpj) return;
    
    if (!validarCNPJ(cnpj)) {
        errorDiv.textContent = 'CNPJ inválido';
        return;
    }
    
    errorDiv.textContent = '';
    
    try {
        const response = await fetch(`https://brasilapi.com.br/api/cnpj/v1/${cnpj}`);
        if (response.ok) {
            const data = await response.json();
            document.getElementById('razao-social').value = data.razao_social.toUpperCase();
        }
    } catch (error) {
        console.log('Erro ao buscar CNPJ');
    }
});

// Buscar CEP
document.getElementById('cep').addEventListener('blur', async function() {
    const cep = this.value.replace(/\D/g, '');
    const errorDiv = document.getElementById('cep-error');
    
    if (!cep || cep.length !== 8) return;
    
    try {
        const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
        if (response.ok) {
            const data = await response.json();
            if (!data.erro) {
                document.getElementById('endereco').value = data.logradouro.toUpperCase();
                document.getElementById('bairro').value = data.bairro.toUpperCase();
                document.getElementById('cidade').value = data.localidade.toUpperCase();
                document.getElementById('estado').value = data.uf.toUpperCase();
                document.getElementById('numero').focus();
                errorDiv.textContent = '';
            } else {
                errorDiv.textContent = 'CEP não encontrado';
            }
        }
    } catch (error) {
        errorDiv.textContent = 'Erro ao buscar CEP';
    }
});

// Validar CPF
document.getElementById('cpf').addEventListener('blur', function() {
    const cpf = this.value.replace(/\D/g, '');
    const errorDiv = document.getElementById('cpf-error');
    
    if (!cpf) return;
    
    if (!validarCPF(cpf)) {
        errorDiv.textContent = 'CPF inválido';
    } else {
        errorDiv.textContent = '';
    }
});

// Autocomplete
function criarAutocomplete(input) {
    const container = input.parentElement.querySelector('.autocomplete-items');
    const valor = input.value.toUpperCase();
    
    container.innerHTML = '';
    
    const filtrados = produtosDisponiveis.filter(p => 
        p.includes(valor) || valor === ''
    ).slice(0, 5);
    
    filtrados.forEach(produto => {
        const div = document.createElement('div');
        div.className = 'autocomplete-item';
        div.textContent = produto;
        div.onclick = () => {
            input.value = produto;
            container.innerHTML = '';
            recalcularTotal();
        };
        container.appendChild(div);
    });
}

// Produtos
function adicionarListenersProduto(item) {
    const descInput = item.querySelector('input[name="descricao"]');
    const valorInput = item.querySelector('input[name="valor"]');
    const qtdInput = item.querySelector('input[name="quantidade"]');
    
    descInput.addEventListener('input', function() {
        this.value = this.value.toUpperCase();
        criarAutocomplete(this);
    });
    
    descInput.addEventListener('focus', function() {
        criarAutocomplete(this);
    });
    
    descInput.addEventListener('blur', function() {
        setTimeout(() => {
            this.parentElement.querySelector('.autocomplete-items').innerHTML = '';
        }, 200);
    });
    
    valorInput.addEventListener('input', function() {
        const valor = this.value.replace(/\D/g, '');
        this.value = formatarMoeda(valor);
        recalcularTotal();
    });
    
    qtdInput.addEventListener('input', recalcularTotal);
}

function adicionarProduto() {
    const container = document.getElementById('produtos');
    const novo = document.createElement('div');
    novo.className = 'produto-item';
    novo.innerHTML = `
        <div class="produto-grid">
            <input type="number" name="quantidade" placeholder="Qtd" min="1" value="1">
            <div class="autocomplete">
                <input type="text" name="descricao" placeholder="Descrição do produto">
                <div class="autocomplete-items"></div>
            </div>
        </div>
        <div class="produto-valor-grid">
            <input type="text" name="valor" placeholder="Valor unitário (R$)">
            <button type="button" class="remover-produto" onclick="removerProduto(this)">×</button>
        </div>
    `;
    container.appendChild(novo);
    adicionarListenersProduto(novo);
    novo.querySelector('input[name="quantidade"]').focus();
}

function removerProduto(btn) {
    const items = document.querySelectorAll('.produto-item');
    if (items.length > 1) {
        btn.closest('.produto-item').remove();
        recalcularTotal();
    }
}

function recalcularTotal() {
    if (tipoNota === 'nfs') {
        const total = lerValor(document.getElementById('valor-servico').value) || 0;
        document.getElementById('total').textContent = `R$ ${total.toFixed(2).replace('.', ',')}`;
        return;
    }
    let total = 0;
    document.querySelectorAll('.produto-item').forEach(item => {
        const qtd = parseFloat(item.querySelector('input[name="quantidade"]').value) || 0;
        const valor = parseFloat(item.querySelector('input[name="valor"]').value.replace(',', '.')) || 0;
        total += qtd * valor;
    });
    document.getElementById('total').textContent = `R$ ${total.toFixed(2).replace('.', ',')}`;
}

// Enviar WhatsApp
function enviarWhatsApp() {
    if (!tipoNota) {
        alert('Selecione o tipo de nota: NFA ou NFS!');
        return;
    }
    const tituloDados = tipoNota === 'nfs' ? 'DADOS DO TOMADOR' : 'DADOS DO COMPRADOR';
    let dados = '';
    let erro = false;
    
    if (tipoCliente === 'cnpj') {
        const cnpj = document.getElementById('cnpj').value;
        const razao = document.getElementById('razao-social').value.trim();
        
        if (!cnpj || !razao) {
            alert('Preencha todos os campos obrigatórios!');
            return;
        }
        
        if (!validarCNPJ(cnpj)) {
            alert('CNPJ inválido!');
            return;
        }
        
        dados = `*${tituloDados}:*\nEmpresa: ${razao.toUpperCase()}\nCNPJ: ${cnpj}\n`;
    } else {
        const cpf = document.getElementById('cpf').value;
        const nome = document.getElementById('nome-completo').value.trim();
        const cep = document.getElementById('cep').value;
        const endereco = document.getElementById('endereco').value.trim();
        const numero = document.getElementById('numero').value.trim();
        const complemento = document.getElementById('complemento').value.trim();
        const bairro = document.getElementById('bairro').value.trim();
        const cidade = document.getElementById('cidade').value.trim();
        const estado = document.getElementById('estado').value.trim();
        const telefone = document.getElementById('telefone').value.trim();
        
        if (!cpf || !nome || !cep || !endereco || !numero || !bairro || !cidade || !estado) {
            alert('Preencha todos os campos obrigatórios!');
            return;
        }
        
        if (!validarCPF(cpf)) {
            alert('CPF inválido!');
            return;
        }
        
        dados = `*${tituloDados}:*\nNome: ${nome.toUpperCase()}\nCPF: ${cpf}\n`;
        dados += `Endereço: ${endereco.toUpperCase()}, ${numero}`;
        if (complemento) dados += ` - ${complemento.toUpperCase()}`;
        dados += `\nBairro: ${bairro.toUpperCase()}\nCidade: ${cidade.toUpperCase()}/${estado.toUpperCase()}\nCEP: ${cep}\n`;
        if (telefone) dados += `Telefone: ${telefone}\n`;
    }
    
    const pagamento = document.getElementById('pagamento').value;
    if (!pagamento) {
        alert('Selecione a forma de pagamento!');
        return;
    }
    
    let conteudo = '';
    let total = 0;

    if (tipoNota === 'nfs') {
        const descricao = document.getElementById('descricao-servico').value.trim();
        total = lerValor(document.getElementById('valor-servico').value);
        if (!descricao) {
            alert('Preencha a descrição do serviço!');
            document.getElementById('descricao-servico').focus();
            return;
        }
        if (!Number.isFinite(total) || total <= 0) {
            alert('Informe um valor do serviço maior que zero!');
            document.getElementById('valor-servico').focus();
            return;
        }
        conteudo = `*DESCRIÇÃO DO SERVIÇO:*\n${descricao}\n`;
    } else {
        let produtos = '';
        document.querySelectorAll('.produto-item').forEach(item => {
            const qtd = Number(item.querySelector('input[name="quantidade"]').value);
            const desc = item.querySelector('input[name="descricao"]').value.trim();
            const valor = lerValor(item.querySelector('input[name="valor"]').value);
            if (!desc || !Number.isFinite(qtd) || !Number.isFinite(valor) || qtd <= 0 || valor <= 0) {
                erro = true;
            }
            total += qtd * valor;
            produtos += `${qtd} | ${desc.toUpperCase()} | R$ ${valor.toFixed(2).replace('.', ',')}\n`;
        });
        if (erro || !Number.isFinite(total)) {
            alert('Preencha todos os produtos corretamente!');
            return;
        }
        conteudo = `*LISTA DE PRODUTOS:*\n${produtos}`;
    }

    const mensagem = `*PEDIDO DE ${tipoNota.toUpperCase()}*\n\n${dados}\n${conteudo}\n*TOTAL DA NOTA:* R$ ${total.toFixed(2).replace('.', ',')}\n*FORMA DE PAGAMENTO:* ${pagamento}`;

    const numeroWhatsApp = '5555996636737';
    const url = `https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(mensagem)}`;
    window.open(url, '_blank', 'noopener,noreferrer');
}

// Inicializar
document.querySelectorAll('.produto-item').forEach(adicionarListenersProduto);
document.addEventListener('click', function(e) {
    if (!e.target.closest('.autocomplete')) {
        document.querySelectorAll('.autocomplete-items').forEach(el => el.innerHTML = '');
    }
});
